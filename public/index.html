<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171512">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<title>Claude Cockpit</title>
<link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="mobile-bar">
    <button id="btn-drawer" aria-label="会话列表">☰</button>
    <span id="mobile-title">Claude Cockpit</span>
    <button id="btn-running" title="运行中">◉</button>
  </div>
  <div id="drawer-backdrop"></div>
  <aside id="sidebar">
    <div class="side-head">
      <span class="brand">Claude Cockpit</span>
      <span class="side-head-btns">
        <button id="btn-phone" title="手机访问">▤</button>
        <button id="btn-refresh" title="刷新会话列表">⟳</button>
      </span>
    </div>
    <div class="side-actions">
      <button id="btn-new-chat">＋ Claude</button>
      <button id="btn-new-cursor">＋ Cursor</button>
      <button id="btn-new-term">本地终端</button>
      <button id="btn-new-ssh">SSH</button>
    </div>
    <input id="filter" type="text" placeholder="筛选会话…">
    <div id="term-list" class="side-section"></div>
    <div id="session-list" class="side-section grow"></div>
  </aside>

  <main id="main">
    <div id="welcome" class="view">
      <div class="welcome-inner">
        <h1>Claude Cockpit</h1>
        <p>左侧选择一个 Claude Code 或 Cursor Agent 会话继续对话；<br>或打开本地终端 / SSH 远程终端。</p>
      </div>
    </div>

    <div id="running-view" class="view" hidden>
      <header id="running-head">
        <div>运行中</div>
        <span>
          <button id="btn-awake" title="阻止电脑睡眠">☾</button>
          <button id="btn-push" title="开启完成通知">🔔</button>
          <button id="btn-running-refresh" title="刷新">⟳</button>
        </span>
      </header>
      <div id="running-list"></div>
    </div>

    <div id="chat-view" class="view" hidden>
      <header id="chat-head">
        <div class="chat-title-wrap">
          <div id="chat-title">—</div>
          <div id="chat-sub">—</div>
        </div>
        <div class="chat-controls">
          <label>模型
            <select id="model-sel">
              <option value="" selected>默认</option>
              <optgroup id="og-claude" class="model-claude" label="Claude Code">
                <option value="claude-opus-5">Opus 5</option>
                <option value="claude-fable-5">Fable 5</option>
                <option value="claude-sonnet-5">Sonnet 5</option>
                <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
                <option value="claude-opus-4-8">Opus 4.8</option>
              </optgroup>
              <optgroup id="og-cursor" class="model-cursor" label="Cursor Agent" hidden>
                <option value="composer-2.5">Composer 2.5</option>
                <option value="claude-opus-5-thinking-high">Opus 5 Thinking</option>
                <option value="claude-sonnet-5-thinking-high">Sonnet 5 Thinking</option>
                <option value="claude-fable-5-thinking-high">Fable 5 Thinking</option>
                <option value="gpt-5.6-sol-high">GPT-5.6 Sol High</option>
                <option value="cursor-grok-4.6-high-fast">Grok 4.6 Fast</option>
                <option value="gemini-3.7-flash-high">Gemini 3.7 Flash</option>
              </optgroup>
              <option value="__custom__">自定义…</option>
            </select>
          </label>
          <label>权限
            <select id="perm-mode">
              <option value="acceptEdits" selected>acceptEdits</option>
              <option value="default">default</option>
              <option value="plan">plan</option>
              <option value="bypassPermissions">bypassPermissions</option>
            </select>
          </label>
        </div>
      </header>
      <div id="messages"></div>
      <div id="composer">
        <div class="composer-main">
          <div id="attach-strip" hidden></div>
          <textarea id="input" rows="3" placeholder="Enter 发送 · Shift+Enter 换行 · / 命令 · @ 临时换模型 · 可粘贴图片"></textarea>
        </div>
        <div class="composer-side">
          <button id="btn-send">发送</button>
          <button id="btn-stop" hidden>停止</button>
          <button id="btn-attach" title="添加图片">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10.6 3.2a2.4 2.4 0 0 1 3.4 3.4l-6.3 6.3a3.8 3.8 0 0 1-5.4-5.4l6-6a1 1 0 0 1 1.4 1.4l-6 6a1.8 1.8 0 0 0 2.6 2.6l6.3-6.3a.4.4 0 0 0-.6-.6l-5.6 5.6a1 1 0 1 1-1.4-1.4l5.6-5.6z" fill="currentColor"/></svg>
          </button>
          <input id="file-input" type="file" accept="image/*" multiple hidden>
        </div>
      </div>
    </div>

    <div id="term-view" class="view" hidden>
      <header id="term-head">
        <div id="term-title">终端</div>
        <button id="btn-close-term">关闭终端</button>
      </header>
      <div id="term-container"></div>
    </div>
  </main>
</div>

<dialog id="ssh-dialog">
  <form method="dialog" id="ssh-form">
    <h2>SSH 连接</h2>
    <div id="saved-hosts"></div>
    <label>主机 <input name="host" required placeholder="38.76.164.104"></label>
    <div class="row">
      <label>端口 <input name="port" value="22" size="5"></label>
      <label>用户 <input name="username" required placeholder="ubuntu"></label>
    </div>
    <label>密码 <input name="password" type="password" required></label>
    <label class="check"><input name="save" type="checkbox"> 保存该主机（密码明文存本机 ~/.claude-cockpit/，仅限自己电脑）</label>
    <div class="row end">
      <button value="ok" id="ssh-connect">连接</button>
      <button value="cancel" formnovalidate>取消</button>
    </div>
  </form>
</dialog>

<dialog id="phone-dialog">
  <form method="dialog" id="phone-form">
    <h2>手机访问</h2>
    <label>公网地址 <input name="base" placeholder="https://cockpit.verdictfinance.top"></label>
    <div class="row end"><button value="ok">生成二维码</button><button value="cancel" formnovalidate>关闭</button></div>
    <div id="phone-qr"></div>
  </form>
</dialog>

<dialog id="newchat-dialog">
  <form method="dialog" id="newchat-form">
    <h2>新会话</h2>
    <label>引擎
      <select name="engine">
        <option value="claude" selected>Claude Code</option>
        <option value="cursor">Cursor Agent</option>
      </select>
    </label>
    <label>工作目录 <input name="cwd" placeholder="/Users/looperhome"></label>
    <div class="row end">
      <button value="ok">创建</button>
      <button value="cancel" formnovalidate>取消</button>
    </div>
  </form>
</dialog>

<script src="/vendor/marked/marked.min.js"></script>
<script src="/vendor/dompurify/dist/purify.min.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/contrib/auto-render.min.js"></script>
<script src="/vendor/xterm/lib/xterm.js"></script>
<script src="/vendor/xterm-fit/lib/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
