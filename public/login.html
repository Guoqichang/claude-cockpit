<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Cockpit · 需要令牌</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #171512; color: #e8e2d6;
    font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .card {
    width: min(380px, 88vw); padding: 28px 26px;
    background: #1f1c18; border: 1px solid #2e2a24; border-radius: 14px;
  }
  h1 { margin: 0 0 6px; font: 500 18px/1.4 Georgia, "Songti SC", serif; color: #c9a45c; }
  p { margin: 0 0 18px; color: #9a917f; font-size: 13px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px;
    background: #171512; border: 1px solid #2e2a24; border-radius: 8px;
    color: #e8e2d6; font-size: 14px; outline: none;
  }
  input:focus { border-color: #8a7340; }
  button {
    width: 100%; padding: 10px; border: 1px solid #8a7340; border-radius: 8px;
    background: #c9a45c; color: #1a1610; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .hint { margin-top: 14px; font-size: 12px; color: #6f6857; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Claude Cockpit</h1>
    <p>此入口需要访问令牌。用电脑上「手机访问」里的二维码可直接登录。</p>
    <input name="t" type="password" placeholder="粘贴令牌" autocomplete="current-password" required>
    <button type="submit">进入</button>
    <div class="hint">令牌存放于电脑的 ~/.claude-cockpit/auth.json</div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = new FormData(e.target).get('t').trim();
    if (t) location.href = '/?t=' + encodeURIComponent(t);
  });
</script>
</body>
</html>
